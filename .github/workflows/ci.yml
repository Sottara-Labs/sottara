name: CI
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - edited
    branches:
    - main
    - develop
env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: '24'
  RUST_VERSION: 1.98.0
  OPTIC_VERSIO: 1.0.9
  WRANGLER_VERSION: 4.105.0
  FORK_PR: $`{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
    != github.repository }}
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-$`{ github.workflow }-${{ github.event.pull_request.number || github.ref 
    }}
  cancel-in-progress: true
jobs:
  governance:
    name: Governance Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Validate pull request metadata and scope
      env:
        BASE_REF: ${{ github.base_ref }}
        LARGE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name,
          'large-change-approved') }}
        PR_BODY: $`{ github.event.pull_request.body }}
        PR_TITLE: $`{ github.event.pull_request.title }}
      run: "title_pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\\
([a-z0-9._/-]+\\))?: .+'
if ! grep -Eq \"$title_pattern\" <<< \"$PR_TITLE\"; then
  echo \"PR title must use Conventional Commits format.\" >&2
  exit 1
fi

for heading in \"## Summary\" \"## Validation\"; do
  if ! grep -Fq \"$heading\" <<< \"$PR_BODY\"; then
    echo \"PR body is missing required heading: $heading\" >&2
    exit 1
  fi
done

if ! grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|related)[^[:space:]]*#[0-9]+' <<< \"$PR_BODY\"; then
  echo \"PR body must link an issue using Closes, Fixes, Resolves, or Related: #123.\" >&2
  exit 1
fi

git fetch --no-tags origin \"$BASE_REF\"
changed_files=$(git diff --name-only \"origin/$BASE_REF...HEAD\" | wc -l | tr -d ' ')
changed_lines=$(git diff --numstat \"origin/$BASE_REF...HEAD\" | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')

echo \"Changed files: $changed_files\"
echo \"Changed text lines: $changed_lines\"
if { [ \"$changed_files\" -gt 75 ] || [ \"$changed_lines\" -gt 8000 ]; } && [ \"$LARGE_CHANGE_APPROVED\" != \"true\" ]; then
  echo \"Large PRs require the large-change-approved label and maintainer justification.\" >&2
  exit 1
fi
"
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\
  --gate-id governance \\
  --name \"Governance Checks\" \\
  --owner platform/release \\
  --dependency BETA-088 \\
  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\
  --gate-id governance \\
  --name \"Governance Checks\" \\
  --owner platform/release \\
  --dependency BETA-088 \\
  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ca165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-governance
        path: gate-result-governance.json
        retention-days: 7
        if-no-files-found: ignore
  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/sottara-vitest-localstorage.sqlite
    steps:
    - uses: actions/checkout@19d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Record tool versions
      run: 'echo "### Tool Versions" >> $GITHUB_STEP_SUMMARY

        echo "| Tool | Version |" >> $GITHUB_STEP_SUMMARY

        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

        echo "| Bun | $(bun --version) |" >> $GITHUB_STEP_SUMMARY

        echo "| Node | $(node --version) |" >> $GITHUB_STEP_SUMMARY

        '
    - name: Install dependencies (frozen lockfile)
      run: bun install --frozen-lockfile
    - name: Verify pinned version consistency
      run: node scripts/ci/verify-pinned-versions.mjs --write-gate
    - name: Format Check
      run: bun run format:check
    - name: Lint
      run: bun run lint
    - name: Build reproducibility & drift
      run: node scripts/ci/verify-drift.mjs
    - name: Typecheck
      run: bun x tsc --noEmit
    - name: Generate OpenAPI
      run: bun run generate:openapi
    - name: OpenAPI Compatibility
      if: env.FORK_PR != 'true'
      run: "mkdir -p /tmp/optic-env\ncd /tmp/optic-env\ncat > package.json << 'EOF'\n{\n  \"name\": \"optic-env\",\n  \"version\": \"1.0.0\",\n  \"overrides\"\n: {\n    \"ajv\": \">=8.17.1\",\n    \"ajv-errors\": \">=3.0.0\"\n  }\n}\nEOF\nnpm install --save-exact \"@useoptic/optic@${{ env.OPTIC_VERSION }}\" --prefer-online\ncd \"$GITHUB_WORKSPACE\"\n/tmp/optic-env/node_modules/.bin/optic diff openapi.json --base origin/main --check\n"
      env:
        OPTIC_TOKEN: ${{ secrets.OPTIC_TOKEN }}
    - name: Skip OpenAPI Compatibility on fork RR
      if: env.FORK_PR == 'true'
      run: echo "Skipping OpenAPI compatibility check on fork PR (no OPTIC_TOKEN available
        to run optic diff --check against Optic Cloud)."
    - name: Config Guard
      run: bun run config:check
    - name: Unit Tests
      run: bun run test
    - name: Unit Tests (src co-located)
      run: bun x vitest run src
    - name: Build Client
      run: bun run build
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id client-checks \\\n  --name \"Client Checks\" \\\n  --owner platform/client \\\n  --dependency BETA-088 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id client-checks \\\n  --name \"Client Checks\" \\\n  --owner platform/client \\\n  --dependency BETA-088 \\\n  --status fail\n"
    - name: Upload Client Artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: client-dist
        path: dist/
        if-no-files-found: error
        retention-days: 1
    - name: Upload gate results
      if: always()
      uses: actions/upload-artifact@ca165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-client-checks
        path: 'gate-result-client-checks.json

          gate-result-build-reproducibility.json

          gate-result-pinned-versions.json

          '
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload Client Artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: client-dist
        path: dist/
        retention-days: 1
    timeout-minutes: 45
  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Install Rust (pinned via rust-toolchain.toml)
      uses: dtolnai/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: wasm32v1-none
    - name: Rust Cache
      uses: Swatinemo/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: contracts/soroban
    - name: Test Contracts
      timeout-minutes: 30
      run: 'cd contracts/soroban

        cargo test --workspace --locked

        '
    - name: Build Contracts
      timeout-minutes: 30
      run: 'cd contracts/soroban

        cargo build --target wasm32v1-none --release --locked

        '
    - name: Wasm Size Budget
      run: "echo \"### Wasm Binary Sizes\" >> $GITHUB_STEP_SUMMARY\necho \"| Contract \
        \ | Size | Budget |\" >> $GITHUB_STEP_SUMMARY\necho \"| :--- | :--- | :---\
        \ |\" >> $GITHUB_STEP_SUMMARY
TARGET_DIR=\"contracts/soroban/target/wasm32v1-none/release\"\nOVER=0\nfor wasm in $TARGET_DIR/stealth_*.wasm; do\n  if [ -f \"$wasm\"
        ]; then\n    bytes=$(stat -c%s \"$wasm\")\n    kb=$((bytes / 1024))\n        name=$(basename \"$wasm\")\n    status=\"ok\"\n    if [ \"$kb\" -gt 140
        ]; then status=\"OVER\"; OVER=1; fi\n    echo \"| $name | ${kb} KB | 140
        KB ($status) |\" >> $GITHUB_STEP_SUMMARY\n  fi\ndone\nif [ \"$OVER\" -eq
        1 ]; then exit 1; fi\n"
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id contract-checks \\\n  --name \"Contract Checks\" \\\n  --owner platform/contracts \\\n  --dependency BETA-086 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id contract-checks \\\n  --name \"Contract Checks\" \\\n  --owner platform/contracts \\\n  --dependency BETA-086 \\\n  --status fail\n"
    - name: Upload Contract Artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: contract-wasm
        path: contracts/soroban/target/wasm32v1-none/release/*.wasm
        if-no-files-found: error
        retention-days: 1
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-contract-checks
        path: gate-result-contract-checks.json
        retention-days: 7
        if-no-files-found: ignore
  contract-registry:
    name: Contract Registry
    needs:
    - contract-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download contract wasm
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: contract-wasm
        path: contracts/soroban/target/wasm32v1-none/release
    - name: Verify wasm hashes against manifest
      run: node scripts/ci/verify-wasm-hashes.mjs
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ca165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-contract-registry
        path: gate-result-contract-registry.json
        retention-days: 7
        if-no-files-found: ignore
  beta-migrations:
    name: Migration Gates
    needs:
    - client-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@19d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN.VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - n