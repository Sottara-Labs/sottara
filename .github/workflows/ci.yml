name: CI
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - edited
    branches:
    - main
    - develop
env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: '24'
  RUST_VERSION: 1.98.0
  OPTIC_VERSION: 1.0.9
  WRANGLER_VERSION: 4.105.0
  FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
    != github.repository }}
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
jobs:
  governance:
    name: Governance Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Validate pull request metadata and scope
      env:
        BASE_REF: ${{ github.base_ref }}
        LARGE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name,
          'large-change-approved') }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: "title_pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\\\
        ([a-z0-9._/-]+\\))?!?: .+'\nif ! grep -Eq \"$title_pattern\" <<< \"$PR_TITLE\"\
        ; then\n  echo \"PR title must use Conventional Commits format.\" >&2\n  exit\
        \ 1\nfi\n\nfor heading in \"## Summary\" \"## Validation\"; do\n  if ! grep\
        \ -Fq \"$heading\" <<< \"$PR_BODY\"; then\n    echo \"PR body is missing required\
        \ heading: $heading\" >&2\n    exit 1\n  fi\ndone\n\nif ! grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|related)[[:space:]:]*#[0-9]+'\
        \ <<< \"$PR_BODY\"; then\n  echo \"PR body must link an issue using Closes,\
        \ Fixes, Resolves, or Related: #123.\" >&2\n  exit 1\nfi\n\ngit fetch --no-tags\
        \ origin \"$BASE_REF\"\nchanged_files=$(git diff --name-only \"origin/$BASE_REF...HEAD\"\
        \ | wc -l | tr -d ' ')\nchanged_lines=$(git diff --numstat \"origin/$BASE_REF...HEAD\"\
        \ | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print\
        \ total + 0 }')\n\necho \"Changed files: $changed_files\"\necho \"Changed\
        \ text lines: $changed_lines\"\n\nif { [ \"$changed_files\" -gt 75 ] || [\
        \ \"$changed_lines\" -gt 8000 ]; } && [ \"$LARGE_CHANGE_APPROVED\" != \"true\"\
        \ ]; then\n  echo \"Large PRs require the large-change-approved label and\
        \ maintainer justification.\" >&2\n  exit 1\nfi\n"
  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/sottara-vitest-localstorage.sqlite
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Record tool versions
      run: 'echo "### Tool Versions" >> $GITHUB_STEP_SUMMARY

        echo "| Tool | Version |" >> $GITHUB_STEP_SUMMARY

        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

        echo "| Bun | $(bun --version) |" >> $GITHUB_STEP_SUMMARY

        echo "| Node | $(node --version) |" >> $GITHUB_STEP_SUMMARY

        '
    - name: Install dependencies (frozen lockfile)
      run: bun install --frozen-lockfile
    - name: Verify pinned version consistency
      run: node scripts/ci/verify-pinned-versions.mjs --write-gate
    - name: Format Check
      run: bun run format:check
    - name: Lint
      run: bun run lint
    - name: Build reproducibility & drift
      run: node scripts/ci/verify-drift.mjs
    - name: Typecheck
      run: bun x tsc --noEmit
    - name: Generate OpenAPI
      run: bun run generate:openapi
    - name: OpenAPI Compatibility
      if: env.FORK_PR != 'true'
      run: "mkdir -p /tmp/optic-env\ncd /tmp/optic-env\ncat > package.json << 'EOF'\n\
        {\n  \"name\": \"optic-env\",\n  \"version\": \"1.0.0\",\n  \"overrides\"\
        : {\n    \"ajv\": \">=8.17.1\",\n    \"ajv-errors\": \">=3.0.0\"\n  }\n}\n\
        EOF\nnpm install --save-exact \"@useoptic/optic@${{ env.OPTIC_VERSION }}\"\
        \ --prefer-online\ncd \"$GITHUB_WORKSPACE\"\n/tmp/optic-env/node_modules/.bin/optic\
        \ diff openapi.json --base origin/main --check\n"
      env:
        OPTIC_TOKEN: ${{ secrets.OPTIC_TOKEN }}
    - name: Skip OpenAPI Compatibility on fork PR
      if: env.FORK_PR == 'true'
      run: echo "Skipping OpenAPI compatibility check on fork PR (no OPTIC_TOKEN available
        to run optic diff --check against Optic Cloud)."
    - name: Config Guard
      run: bun run config:check
    - name: Unit Tests
      run: bun run test
    - name: Unit Tests (src co-located)
      run: bun x vitest run src
    - name: Build Client
      run: bun run build
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id client-checks \\\
        \n  --name \"Client Checks\" \\\n  --owner platform/client \\\n  --dependency\
        \ BETA-088 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id client-checks \\\
        \n  --name \"Client Checks\" \\\n  --owner platform/client \\\n  --dependency\
        \ BETA-088 \\\n  --status fail\n"
    - name: Upload Client Artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: client-dist
        path: dist/
        if-no-files-found: error
        retention-days: 1
    - name: Upload gate results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-client-checks
        path: 'gate-result-client-checks.json

          gate-result-build-reproducibility.json

          gate-result-pinned-versions.json

          '
        retention-days: 7
        if-no-files-found: ignore
  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Install Rust (pinned via rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: wasm32v1-none
    - name: Rust Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: contracts/soroban
    - name: Test Contracts
      timeout-minutes: 30
      run: 'cd contracts/soroban

        cargo test --workspace --locked

        '
    - name: Build Contracts
      timeout-minutes: 30
      run: 'cd contracts/soroban

        cargo build --target wasm32v1-none --release --locked

        '
    - name: Wasm Size Budget
      run: "echo \"### Wasm Binary Sizes\" >> $GITHUB_STEP_SUMMARY\necho \"| Contract\
        \ | Size | Budget |\" >> $GITHUB_STEP_SUMMARY\necho \"| :--- | :--- | :---\
        \ |\" >> $GITHUB_STEP_SUMMARY\nTARGET_DIR=\"contracts/soroban/target/wasm32v1-none/release\"\
        \nOVER=0\nfor wasm in $TARGET_DIR/stealth_*.wasm; do\n  if [ -f \"$wasm\"\
        \ ]; then\n    bytes=$(stat -c%s \"$wasm\")\n    kb=$((bytes / 1024))\n  \
        \  name=$(basename \"$wasm\")\n    status=\"ok\"\n    if [ \"$kb\" -gt 140\
        \ ]; then status=\"OVER\"; OVER=1; fi\n    echo \"| $name | ${kb} KB | 140\
        \ KB ($status) |\" >> $GITHUB_STEP_SUMMARY\n  fi\ndone\nif [ \"$OVER\" -eq\
        \ 1 ]; then exit 1; fi\n"
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id contract-checks\
        \ \\\n  --name \"Contract Checks\" \\\n  --owner platform/contracts \\\n \
        \ --dependency BETA-086 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id contract-checks\
        \ \\\n  --name \"Contract Checks\" \\\n  --owner platform/contracts \\\n \
        \ --dependency BETA-086 \\\n  --status fail\n"
    - name: Upload Contract Artifacts
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: contract-wasm
        path: contracts/soroban/target/wasm32v1-none/release/*.wasm
        if-no-files-found: error
        retention-days: 1
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-contract-checks
        path: gate-result-contract-checks.json
        retention-days: 7
        if-no-files-found: ignore
  contract-registry:
    name: Contract Registry
    needs:
    - contract-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download contract wasm
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: contract-wasm
        path: contracts/soroban/target/wasm32v1-none/release
    - name: Verify wasm hashes against manifest
      run: node scripts/ci/verify-wasm-hashes.mjs
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-contract-registry
        path: gate-result-contract-registry.json
        retention-days: 7
        if-no-files-found: ignore
  beta-migrations:
    name: Migration Gates
    needs:
    - client-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Migration integrity check
      run: npm run migrations:integrity-check
    - name: Migration forward & rollback rehearsal
      timeout-minutes: 20
      run: 'npm run migrations:forward -- --approval approved

        npm run migrations:rollback -- --target-version 1 --approval approved

        '
    - name: Migration unit tests
      run: bun x vitest run tests/unit/migrations
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-migrations\
        \ \\\n  --name \"Migration Gates\" \\\n  --owner platform/storage \\\n  --dependency\
        \ BETA-082 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-migrations\
        \ \\\n  --name \"Migration Gates\" \\\n  --owner platform/storage \\\n  --dependency\
        \ BETA-082 \\\n  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-migrations
        path: gate-result-beta-migrations.json
        retention-days: 7
        if-no-files-found: ignore
  beta-backup:
    name: Backup & Restore Gates
    needs:
    - client-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Backup restore rehearsal
      timeout-minutes: 20
      env:
        STEALTH_BACKUP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      run: npm run backup:rehearsal
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-backup \\\n\
        \  --name \"Backup & Restore Gates\" \\\n  --owner platform/storage \\\n \
        \ --dependency BETA-081 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-backup \\\n\
        \  --name \"Backup & Restore Gates\" \\\n  --owner platform/storage \\\n \
        \ --dependency BETA-081 \\\n  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-backup
        path: gate-result-beta-backup.json
        retention-days: 7
        if-no-files-found: ignore
  beta-auth:
    name: Auth & Abuse Gates
    needs:
    - client-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Auth & registration abuse tests
      run: bun x vitest run tests/unit/api/auth
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-auth \\\n \
        \ --name \"Auth & Abuse Gates\" \\\n  --owner security/platform \\\n  --dependency\
        \ BETA-079 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-auth \\\n \
        \ --name \"Auth & Abuse Gates\" \\\n  --owner security/platform \\\n  --dependency\
        \ BETA-079 \\\n  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-auth
        path: gate-result-beta-auth.json
        retention-days: 7
        if-no-files-found: ignore
  beta-security:
    name: Security & Crypto Gates
    needs:
    - client-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Crypto & managed-wallet misuse tests
      id: crypto
      run: 'bun x vitest run tests/unit/crypto

        bun x vitest run src/services/crypto/*.test.ts

        bun x vitest run tests/unit/stellar/managed-wallet.test.ts

        '
    - name: Run crypto misuse regression evidence
      id: crypto_evidence
      run: bun run crypto:misuse-regression
      continue-on-error: true
    - name: Run security regression evidence
      id: security_regression
      run: bun run security:regression
      continue-on-error: true
    - name: Write gate result
      if: always()
      run: "node scripts/ci/write-beta-security-gate.mjs \\\n  --crypto \"${{ steps.crypto.outcome\
        \ }}\" \\\n  --crypto-evidence \"${{ steps.crypto_evidence.outcome }}\" \\\
        \n  --security-regression \"${{ steps.security_regression.outcome }}\" \\\n\
        \  --evidence gate-result-beta-084-security.json\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-security
        path: gate-result-beta-security.json
        retention-days: 7
        if-no-files-found: ignore
  beta-live-data:
    name: Live-Data No-Mock (Local Fake)
    needs:
    - client-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Workflow 2 local-fake journey
      run: bun x vitest run tests/e2e/live-beta/workflow2.test.ts -t "local fake"
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-live-data \\\
        \n  --name \"Live-Data No-Mock (Local Fake)\" \\\n  --owner protocol/relay\
        \ \\\n  --dependency BETA-050 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-live-data \\\
        \n  --name \"Live-Data No-Mock (Local Fake)\" \\\n  --owner protocol/relay\
        \ \\\n  --dependency BETA-050 \\\n  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-live-data
        path: gate-result-beta-live-data.json
        retention-days: 7
        if-no-files-found: ignore
  beta-performance:
    name: Performance Budget
    needs:
    - client-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      timeout-minutes: 10
      run: bun install --frozen-lockfile
    - name: Start dev server
      run: 'setsid bun run dev &

        echo $! > /tmp/sottara-beta-performance.pid

        '
      env:
        STEALTH_AUTH_ALLOW_HEADER_ONLY: '1'
    - name: Wait for dev server
      run: npx --yes wait-on@8.0.1 http://127.0.0.1:5173 --timeout 120000
    - name: Load & performance scenarios
      timeout-minutes: 15
      run: npm run test:load
      env:
        API_URL: http://127.0.0.1:5173
        LOAD_BUDGET_MAX_FAILURE_RATE: '0.10'
        LOAD_BUDGET_MAX_P90_MS: '1200'
        LOAD_BUDGET_MAX_P99_MS: '2500'
        LOAD_BUDGET_MIN_RATE_LIMIT_HITS: '1'
    - name: Stop dev server
      if: always()
      run: "if [ -f /tmp/sottara-beta-performance.pid ]; then\n  kill -- -\"$(cat\
        \ /tmp/sottara-beta-performance.pid)\" 2>/dev/null || true\nfi\n"
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-performance\
        \ \\\n  --name \"Performance Budget\" \\\n  --owner platform/performance \\\
        \n  --dependency BETA-083 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id beta-performance\
        \ \\\n  --name \"Performance Budget\" \\\n  --owner platform/performance \\\
        \n  --dependency BETA-083 \\\n  --status fail\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-performance
        path: gate-result-beta-performance.json
        retention-days: 7
        if-no-files-found: ignore
  beta-acceptance:
    name: Beta Usability & Accessibility Acceptance
    needs:
    - client-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Verify Playwright matches lockfile pin
      run: node scripts/ci/verify-playwright-version.mjs
    - name: Install Playwright browsers
      run: ./node_modules/.bin/playwright install chromium --with-deps
    - name: Acceptance evidence tests
      id: evidence
      run: bun run test:beta:acceptance
    - name: Acceptance journey specs
      id: journeys
      run: bun x playwright test tests/e2e/beta-acceptance/acceptance-journeys.spec.ts
      env:
        CI: true
    - name: Write acceptance evidence artifact
      if: always()
      run: "node -e \"\nconst fs=require('fs');\nconst evidence={\n  issue:'BETA-098',\n\
        \  gateId:'beta-098-acceptance',\n  status: process.env.EVIDENCE==='success'\
        \ && process.env.JOURNEYS==='success' ? 'pass' : 'fail',\n  results:[\n  \
        \  { step:'evidence', status: process.env.EVIDENCE==='success' ? 'pass' :\
        \ 'fail' },\n    { step:'journeys', status: process.env.JOURNEYS==='success'\
        \ ? 'pass' : 'fail' },\n  ],\n};\nfs.writeFileSync('gate-result-beta-098-acceptance.json',\
        \ JSON.stringify(evidence,null,2)+'\\n');\n\"\n"
      env:
        EVIDENCE: ${{ steps.evidence.outcome }}
        JOURNEYS: ${{ steps.journeys.outcome }}
    - name: Write gate result
      if: always()
      run: "node scripts/ci/write-beta-acceptance-gate.mjs \\\n  --journeys \"${{\
        \ steps.journeys.outcome }}\" \\\n  --evidence gate-result-beta-098-acceptance.json\n"
    - name: Upload acceptance Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: acceptance-playwright-report
        path: playwright-report/
        retention-days: 14
        if-no-files-found: ignore
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-beta-acceptance
        path: gate-result-beta-acceptance.json
        retention-days: 7
        if-no-files-found: ignore
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - client-checks
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Verify Playwright matches lockfile pin
      run: node scripts/ci/verify-playwright-version.mjs
    - name: Install Playwright browsers
      timeout-minutes: 10
      run: ./node_modules/.bin/playwright install chromium --with-deps
    - name: Run E2E tests
      timeout-minutes: 20
      run: bun run test:e2e
      env:
        CI: true
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id e2e \\\n  --name\
        \ \"E2E & Browser Gates\" \\\n  --owner platform/client \\\n  --dependency\
        \ BETA-087 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id e2e \\\n  --name\
        \ \"E2E & Browser Gates\" \\\n  --owner platform/client \\\n  --dependency\
        \ BETA-087 \\\n  --status fail\n"
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-e2e
        path: gate-result-e2e.json
        retention-days: 7
        if-no-files-found: ignore
  visual-e2e:
    name: Visual & Cross-Browser E2E
    runs-on: ubuntu-latest
    needs:
    - client-checks
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Verify Playwright matches lockfile pin
      run: node scripts/ci/verify-playwright-version.mjs
    - name: Install Playwright browsers
      run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      timeout-minutes: 15
    - name: Run visual & cross-browser regression tests
      run: bun run test:visual
      env:
        CI: true
    - name: Write gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id visual-e2e \\\n\
        \  --name \"Visual & Cross-Browser E2E\" \\\n  --owner platform/client \\\n\
        \  --dependency BETA-087 \\\n  --status pass\n"
    - name: Write gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id visual-e2e \\\n\
        \  --name \"Visual & Cross-Browser E2E\" \\\n  --owner platform/client \\\n\
        \  --dependency BETA-087 \\\n  --status fail\n"
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: visual-playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-visual-e2e
        path: gate-result-visual-e2e.json
        retention-days: 7
        if-no-files-found: ignore
  security:
    name: Security & Dependency Review
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Dependency Review
      if: github.event_name == 'pull_request' && env.FORK_PR != 'true'
      uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803
      id: depreview
      with:
        retry-on-snapshot-warnings: true
        fail-on-severity: moderate
    - name: Skip dependency review on fork PR
      if: github.event_name == 'pull_request' && env.FORK_PR == 'true'
      run: echo "Skipping dependency review on fork PR (no privileged token scope)."
    - name: Install Gitleaks
      if: env.FORK_PR != 'true'
      id: gitleaks_install
      run: "curl --fail --silent --show-error --location \\\n  https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz\
        \ \\\n  --output /tmp/gitleaks.tar.gz\necho \"a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb\
        \  /tmp/gitleaks.tar.gz\" | sha256sum --check\ntar --extract --gzip --file\
        \ /tmp/gitleaks.tar.gz --directory /tmp gitleaks\n"
    - name: Scan Git history for secrets
      if: env.FORK_PR != 'true'
      id: gitleaks_scan
      run: /tmp/gitleaks git . --redact --verbose
    - name: Write gate result
      if: always()
      run: "node scripts/ci/write-security-gate.mjs \\\n  --fork \"${{ env.FORK_PR\
        \ }}\" \\\n  --dep-review \"${{ steps.depreview.outcome }}\" \\\n  --gitleaks-install\
        \ \"${{ steps.gitleaks_install.outcome }}\" \\\n  --gitleaks-scan \"${{ steps.gitleaks_scan.outcome\
        \ }}\"\n"
    - name: Upload gate result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-security
        path: gate-result-security.json
        retention-days: 7
        if-no-files-found: ignore
  provenance:
    name: Provenance & Hashes
    needs:
    - client-checks
    - contract-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download client artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: client-dist
        path: artifacts/client-dist
    - name: Download contract artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: contract-wasm
        path: artifacts/contract-wasm
    - name: Collect artifact hashes
      run: node scripts/ci/collect-artifact-hashes.mjs
    - name: Scan artifacts for secrets
      run: node scripts/ci/scan-artifacts-for-secrets.mjs --dir artifacts
    - name: Write provenance gate result (pass)
      if: success()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id provenance \\\n\
        \  --name \"Provenance & Hashes\" \\\n  --owner platform/release \\\n  --dependency\
        \ BETA-088 \\\n  --status pass\n"
    - name: Write provenance gate result (fail)
      if: failure()
      run: "node scripts/ci/write-gate-result.mjs \\\n  --gate-id provenance \\\n\
        \  --name \"Provenance & Hashes\" \\\n  --owner platform/release \\\n  --dependency\
        \ BETA-088 \\\n  --status fail\n"
    - name: Upload hash artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-hashes
        path: 'SHA256SUMS

          artifact-hashes.json

          '
        retention-days: 30
    - name: Upload gate results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gate-provenance
        path: 'gate-result-provenance.json

          gate-result-artifact-secrets.json

          '
        retention-days: 7
        if-no-files-found: ignore
  release-gate-summary:
    name: Beta Release Gate Summary
    needs:
    - client-checks
    - contract-checks
    - contract-registry
    - beta-migrations
    - beta-backup
    - beta-auth
    - beta-security
    - beta-live-data
    - beta-performance
    - beta-acceptance
    - e2e
    - visual-e2e
    - security
    - provenance
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download all gate results
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: gate-artifacts
        pattern: gate-*
        merge-multiple: true
    - name: Download release hashes
      if: needs.provenance.result == 'success'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-hashes
        path: gate-artifacts
      continue-on-error: true
    - name: Collect gate result files
      run: "mkdir -p summary-input\nfind gate-artifacts -name 'gate-result-*.json'\
        \ -exec cp {} summary-input/ \\; || true\necho \"Gate result files copied:\"\
        \nls -la summary-input || true\nif [ -f gate-artifacts/artifact-hashes.json\
        \ ]; then\n  cp gate-artifacts/artifact-hashes.json summary-input/\nelse\n\
        \  echo '{\"issue\":\"BETA-088\",\"note\":\"release-hashes artifact missing\
        \ because provenance did not run\",\"artifacts\":[]}' > summary-input/artifact-hashes.json\n\
        \  echo \"Warning: release-hashes artifact missing; placeholder written for\
        \ the summary.\" >&2\nfi\n"
    - name: Generate release gate summary
      run: node scripts/ci/release-gate-summary.mjs --input-dir summary-input --commit
        "${{ github.sha }}"
      continue-on-error: true
    - name: Upload release gate summary
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-gate-summary
        path: 'summary-input/release-gate-summary.json

          summary-input/release-gate-summary.md

          '
        retention-days: 90
    - name: Fail if not releasable
      run: "VERDICT=$(node -e \"console.log(JSON.parse(require('fs').readFileSync('summary-input/release-gate-summary.json','utf8')).verdict)\"\
        )\nRELEASABLE=$(node -e \"console.log(JSON.parse(require('fs').readFileSync('summary-input/release-gate-summary.json','utf8')).releasable)\"\
        )\necho \"Release gate verdict: $VERDICT releasable=$RELEASABLE\"\nif [ \"\
        $VERDICT\" = \"fail\" ] || [ \"$VERDICT\" = \"blocked\" ]; then\n  echo \"\
        Beta release not passing — see release-gate-summary artifact for ownership.\"\
        \n  exit 1\nfi\n"
